# Gitleaks configuration for asteroids-demoscene
# See https://github.com/gitleaks/gitleaks for documentation

title = "Asteroids Demoscene - Gitleaks Configuration"

[extend]
  # Use gitleaks default ruleset as base
  useDefault = true

[[rules]]
  id = "supabase-service-role-key"
  description = "Supabase service role JWT"
  regex = '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[A-Za-z0-9+/=]+\.[A-Za-z0-9+/=_-]+'''
  tags = ["supabase", "jwt", "high-severity"]
  [[rules.Entropies]]
    Min = 3.5
    Max = 8.0

[[rules]]
  id = "vite-hmac-secret"
  description = "VITE_SCORE_HMAC_SECRET hardcoded value"
  regex = '''VITE_SCORE_HMAC_SECRET\s*=\s*[^\s$"'\[]{16,}'''
  tags = ["hmac", "secret", "high-severity"]

[[rules]]
  id = "admin-secret-key"
  description = "Admin secret key hardcoded"
  regex = '''ADMIN_SECRET_KEY\s*=\s*[^\s$"'\[]{8,}'''
  tags = ["admin", "secret"]

[allowlist]
  description = "Global allowlist for false positives"
  files = [
    ".gitleaks.toml",
    ".credentialAllowlist",
    "docs/CREDENTIAL_AUDIT_REPORT.md",
    "docs/SECRET_SCANNING.md",
  ]
  paths = [
    '''(^|/)\.env\.example$''',
    '''(^|/)SECURITY\.md$''',
  ]
  regexes = [
    # Placeholder values in example files
    '''<your-project-ref>''',
    '''<your-supabase-anon-key>''',
    '''<your-strong-random-secret>''',
    # Template literals that reference env vars (not actual values)
    '''\$\{?VITE_SCORE_HMAC_SECRET\}?''',
    '''\$\{?VITE_SUPABASE''',
    # Test/documentation patterns
    '''example\.(com|org|net)''',
  ]
  commits = []
  stopWords = ["placeholder", "example", "your-project", "your-secret"]
