name: Credentials Audit

on:
  schedule:
    # Run every Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      depth:
        description: 'Scan depth: full | recent'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - recent

jobs:
  historical-audit:
    name: Full History Credential Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Run TruffleHog deep scan
        run: |
          trufflehog git file://. \
            --since-commit HEAD~100 \
            --only-verified \
            --json \
            --no-update \
            | tee /tmp/trufflehog-report.json || true

      - name: Run Gitleaks historical scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --config=.gitleaks.toml --redact --log-opts="--all"

      - name: Run pattern audit script
        run: |
          chmod +x scripts/audit-credentials.sh
          bash scripts/audit-credentials.sh 2>&1 | tee /tmp/credential-audit.txt || true

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: credential-audit-${{ github.run_id }}
          path: |
            /tmp/trufflehog-report.json
            /tmp/credential-audit.txt
          retention-days: 30

  env-file-audit:
    name: Environment File Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for .env files in git history
        run: |
          echo "=== Checking git history for .env files ==="
          git log --all --full-history -- '*.env' '**/.env' '.env.*' '**/.env.*' \
            --pretty=format:"%h %s" | head -50 || echo "None found"
          echo ""
          echo "=== Checking current tree for untracked .env files ==="
          find . -name '.env' -o -name '.env.local' -o -name '.env.production' \
            | grep -v node_modules | grep -v .git || echo "None found in working tree"

      - name: Verify .gitignore coverage
        run: |
          echo "=== .gitignore env patterns ==="
          grep -E '\.env' .gitignore || echo "WARNING: No .env patterns in .gitignore"

  supabase-audit:
    name: Supabase Credential Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for Supabase keys in code
        run: |
          echo "=== Checking for hardcoded Supabase service role keys ==="
          git log --all -p -- '*.ts' '*.tsx' '*.js' '*.mjs' \
            | grep -i 'service_role\|SUPABASE_SERVICE_ROLE' || echo "None found"

          echo "=== Checking for hardcoded HMAC secrets ==="
          git log --all -p -- '*.ts' '*.tsx' '*.js' '*.mjs' \
            | grep -i 'HMAC_SECRET\|hmac_secret' || echo "None found"

          echo "=== Checking for bearer tokens or API keys ==="
          grep -rn --include='*.ts' --include='*.tsx' --include='*.js' \
            -E 'Bearer [A-Za-z0-9+/=]{20,}|api[_-]?key\s*[:=]\s*["\x27][A-Za-z0-9]{20,}' \
            src/ supabase/ || echo "None found"
