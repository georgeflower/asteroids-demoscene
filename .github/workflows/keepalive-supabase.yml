name: Keep Supabase awake
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "${{ vars.NEKOWEB_SUPABASE_URL }}/rest/v1/seasons?select=id&limit=1" \
            -H "apikey: ${{ vars.NEKOWEB_SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ vars.NEKOWEB_SUPABASE_KEY }}"
