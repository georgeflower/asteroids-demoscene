name: Secret Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Detect secrets with Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  env-safety:
    name: Verify .env files are not committed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for committed .env files
        run: |
          # Fail if any .env file (not .env.example) is tracked by git
          if git ls-files | grep -E '^\.env$|^\.env\.[^e]'; then
            echo "❌ ERROR: A .env file has been committed to the repository!"
            echo "   Remove it with: git rm --cached .env"
            echo "   Then rotate any exposed credentials."
            exit 1
          fi
          echo "✅ No .env files committed."

      - name: Scan for hardcoded secrets patterns
        run: |
          # Scan for common secret patterns in source files
          PATTERNS=(
            'SUPABASE_SERVICE_ROLE_KEY\s*=\s*[a-zA-Z0-9_.-]+'
            'ADMIN_SECRET_KEY\s*=\s*[a-zA-Z0-9_.-]+'
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[a-zA-Z0-9_-]{50,}'
          )
          FOUND=0
          for PATTERN in "${PATTERNS[@]}"; do
            if grep -rE "$PATTERN" --include="*.ts" --include="*.tsx" --include="*.js" \
                --include="*.json" --exclude-dir=node_modules --exclude-dir=.git .; then
              echo "❌ Potential secret found matching pattern: $PATTERN"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            exit 1
          fi
          echo "✅ No hardcoded secret patterns detected."
