name: Secret Scanning

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      scan_history:
        description: 'Scan full git history (slower)'
        required: false
        default: 'false'
        type: boolean

jobs:
  gitleaks:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          args: detect --config=.gitleaks.toml --redact --verbose

  trufflehog:
    name: TruffleHog Entropy Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  pattern-scan:
    name: Pattern-Based Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-secrets
        run: |
          git clone https://github.com/awslabs/git-secrets.git /tmp/git-secrets
          cd /tmp/git-secrets && sudo make install

      - name: Configure git-secrets patterns
        run: |
          git secrets --register-aws
          # Load app-specific patterns from .secretsrc
          if [ -f .secretsrc ]; then
            while IFS= read -r pattern || [ -n "$pattern" ]; do
              [[ "$pattern" =~ ^#.*$ || -z "$pattern" ]] && continue
              git secrets --add "$pattern"
            done < .secretsrc
          fi

      - name: Scan repository
        run: git secrets --scan-history
